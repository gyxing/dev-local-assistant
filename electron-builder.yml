appId: com.devbox.app
productName: 开发者工具箱
asar: true

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: electron/resources/hosts-helper.ps1
    to: hosts-helper.ps1
  - from: electron/resources/desktop-layer.ps1
    to: desktop-layer.ps1
  - from: build/icon.ico
    to: icon.ico
  - from: electron/resources/tray-icons
    to: tray-icons

# 只打包应用实际使用的 Chromium 语言资源，去掉其余 53 个 pak（约 47 MB 未压缩体积）
electronLanguages:
  - zh-CN
  - en-US

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 开发者工具箱
  runAfterFinish: true

# 文件名由 package.json 的 name 驱动，平台与架构段便于将来多平台产物并存
artifactName: ${name}-${os}-${arch}-${version}.${ext}
